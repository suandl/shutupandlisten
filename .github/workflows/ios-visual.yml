name: iOS Visual Capture

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install capture tools
        run: |
          brew install chargepoint/xcparse/xcparse || true

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ios/build/DerivedData/SourcePackages
          key: spm-${{ hashFiles('ios/ShutUpAndListenKit/Package.swift') }}

      - name: Capture demo
        # The UITest drives the real pipeline from the bundled fixture in-app
        # (design: in-app audio injection); the in-app watchdog paints the seed
        # transcript only if injected transcription yields nothing. Set
        # CAPTURE_SEED_TRANSCRIPT=1 here to force the display-only paint instead.
        run: ./ios/scripts/capture-demo.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-visual-artifacts
          path: ios/build/artifacts/**
          if-no-files-found: warn
