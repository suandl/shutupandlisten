name: iOS Visual Capture

# STAYS workflow_dispatch ON PURPOSE (su-uzy9.6). This job PRODUCES artifacts —
# a video and light/dark screenshots — by driving the real UI through a UITest,
# twice, on a simulator. Its real trigger is a human who wants to look at
# something. Automating it onto every App PR would make the flakiest job in the
# repo a blocking check at 10x billing, to produce artifacts nobody reads on a
# PR.
#
# The App target's automatic GATES live in ios-app-gates.yml: same macos-26
# image, path-filtered push/PR trigger, Gate A3 + B1 + B5. Look there for "does
# ios/App still build and are the migration tests green", and here for "show me
# what the app actually looks like doing it".
#
# First green end-to-end run: 31768705979 (2026-08-14, macos-26 / Xcode 26.6).

on:
  workflow_dispatch:

jobs:
  capture:
    # macos-26 (arm64, GA, also reachable as macos-latest) is the image that
    # carries Xcode 26 — and therefore the iOS 26 SDK and SpeechAnalyzer. The
    # previous macos-14 label is now deprecated by actions/runner-images on top
    # of shipping no Xcode newer than 16. Same architecture as before (plain
    # macos-14 and plain macos-26 are both arm64), so capture-demo.sh's
    # "any booted arm64 sim" assumption is unchanged.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        # Every Xcode on this image is 26.x (26.0.1 … 26.6), so the image
        # default is already correct — but select it explicitly and assert the
        # major so a future image that re-points the default to 27 fails here,
        # loudly, instead of silently building against the wrong SDK.
        #
        # Note there is deliberately no /Applications/Xcode_26.app: the image
        # ships only exact-version paths (Xcode_26.6.app) and their x.y
        # symlinks (Xcode_26.0.app … Xcode_26.4.app). The bare-major path that
        # the old Xcode_16.app line would suggest does not exist, and pinning
        # an exact patch would break on the next image refresh, so go through
        # the /Applications/Xcode.app default symlink.
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          major="$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')"
          if [ "$major" != "26" ]; then
            echo "::error::ios-visual needs Xcode 26.x for the iOS 26 SDK and SpeechAnalyzer; runner default is ${major}.x"
            exit 1
          fi

      - name: Install capture tools
        run: |
          brew install chargepoint/xcparse/xcparse || true

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ios/build/DerivedData/SourcePackages
          key: spm-${{ hashFiles('ios/ShutUpAndListenKit/Package.swift') }}

      - name: Capture demo
        # The UITest drives the real pipeline from the bundled fixture in-app
        # (design: in-app audio injection); the in-app watchdog paints the seed
        # transcript only if injected transcription yields nothing. Set
        # CAPTURE_SEED_TRANSCRIPT=1 here to force the display-only paint instead.
        run: ./ios/scripts/capture-demo.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-visual-artifacts
          path: ios/build/artifacts/**
          if-no-files-found: warn
