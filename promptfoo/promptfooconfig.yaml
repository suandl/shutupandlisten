description: shutupandlisten — listener-prompt evaluation harness

# Matrix:
#   3 prompts   (prompts/claude.md [v0], prompts/chatgpt.md [hardened],
#                prompts/gemini.md [v0 + spoken-output hygiene])
#   × 3 cloud providers (openai:gpt-4o, anthropic:claude-haiku-4-5,
#                        google:gemini-2.5-flash)
#   × 4 scenarios (scenarios/*.yaml — driven multi-turn by simulators/thinker.md)
#   × 4 judges  (probing-depth, restraint, no-summarize, variety)
#
# The prompts started byte-identical at v0. Su-lou.11 hardened chatgpt.md
# (the prompt the web app ships) while claude.md stayed at v0, so the
# prompt axis now measures that hardened variant against the locked
# baseline.
#
# gemini.md (su-5ky) is a THIRD point on that axis, forked from claude.md —
# the v0 baseline, which the 2026-08-05 re-score measured as the better of
# the two on exactly the judges this fork cares about (probing 5.00 vs 3.50,
# restraint 2.00 vs 1.88, B3 4.00 vs 3.38; see
# docs/findings/listener-eval-rescore-2026-08.md §3b). The fork deliberately
# does NOT import chatgpt.md's response *hierarchy* — that same re-score (§5)
# names the hierarchy's level-2 "minimal acknowledgment" and level-3 "short
# momentum-preserving reflection" rungs as the mechanism behind the hardened
# prompt's −1.50 probing and −0.62 B3 regressions. What it DOES import is the
# orthogonal half: spoken-output hygiene (no markdown, no stage directions,
# finished sentences), which claude.md lacks entirely and which every voice
# surface needs. See docs/findings/gemini-prompt-variant-2026-08.md.
#
# Each scenario runs as a 4-6 turn conversation: simulators/thinker.md
# drives the user (thinker) side using the scenario's `topic` and
# `idea_arc`, reactive to the listener's reply each turn. The
# system under test produces the listener turn. providers/multi-turn.js
# orchestrates the loop and returns the full transcript as the output;
# the judges score against that transcript.

prompts:
  # Each prompt is a chat template that pairs the system prompt from
  # prompts/*.md with the starting turn from the active scenario. The
  # multi-turn provider parses this JSON chat array, extracts the
  # system prompt (listener role) and the starting user turn, then
  # runs the simulator/listener loop from there. All three system-prompt
  # vars (claude_system / chatgpt_system / gemini_system) are set in
  # defaultTest.vars — each prompt template references only its own.
  # `starting_turn` (and the rest of the scenario keys) come from the
  # scenario YAML, loaded into each test via `tests: file://…` below.
  #
  # Prompts and providers cross fully: every prompt runs on every provider,
  # so `gemini` is a prompt VARIANT, not "the prompt for the Gemini model".
  # That is deliberate — the prompt axis and the model axis are separable
  # only if both are crossed, and the 2026-08-05 re-score turned on exactly
  # that separation (prompt effect 0.62 vs model effect 0.88 on B3).
  - id: claude-listener
    label: claude
    raw: |-
      [
        {"role": "system", "content": {{ claude_system | dump }}},
        {"role": "user",   "content": {{ starting_turn | dump }}}
      ]
  - id: chatgpt-listener
    label: chatgpt
    raw: |-
      [
        {"role": "system", "content": {{ chatgpt_system | dump }}},
        {"role": "user",   "content": {{ starting_turn | dump }}}
      ]
  - id: gemini-listener
    label: gemini
    raw: |-
      [
        {"role": "system", "content": {{ gemini_system | dump }}},
        {"role": "user",   "content": {{ starting_turn | dump }}}
      ]

providers:
  # Each provider is a multi-turn loop wrapping a voice-class listener
  # model. The simulator is pinned to a single model across all cells
  # so the "thinker" side is a constant — only the listener (prompt ×
  # target model) varies. Cost: ~5 listener calls + ~4 simulator calls
  # per cell.
  #
  # If your local promptfoo doesn't recognize these exact target IDs,
  # substitute the closest available (e.g., openai:gpt-4o-mini,
  # anthropic:claude-3-5-haiku-latest).
  - id: file://providers/multi-turn.js
    label: openai-gpt-4o
    config:
      targetModel: openai:gpt-4o
      simulatorModel: openai:gpt-4o
      maxTurns: 5
      simulatorSystemPath: simulators/thinker.md
  - id: file://providers/multi-turn.js
    label: anthropic-claude-haiku-4-5
    config:
      targetModel: anthropic:claude-haiku-4-5
      simulatorModel: openai:gpt-4o
      maxTurns: 5
      simulatorSystemPath: simulators/thinker.md
  # Third cloud rung (su-5ky). gemini-2.5-flash is the voice-class tier that
  # matches gpt-4o / haiku-4-5 — the flash line is what a live voice loop can
  # afford, and promptfoo 0.121 knows the id natively via the `google:` (AI
  # Studio) provider.
  #
  # NEEDS A CREDENTIAL THAT DOES NOT EXIST YET. promptfoo resolves this
  # provider's key as GOOGLE_API_KEY -> GOOGLE_GENERATIVE_AI_API_KEY ->
  # GEMINI_API_KEY, and the `shutupandlisten` 1Password vault currently holds
  # only `openai` and `anthropic` items — so these cells ERROR until someone
  # provisions one. See promptfoo/.env.op for the one-line enable and
  # promptfoo/README.md → "Adding the Gemini key" for why that line is
  # commented out rather than shipped live.
  #
  # The simulator stays pinned to openai:gpt-4o here, exactly as on the other
  # rungs: only the listener may vary, or the thinker becomes a confound.
  - id: file://providers/multi-turn.js
    label: google-gemini-2.5-flash
    config:
      targetModel: google:gemini-2.5-flash
      simulatorModel: openai:gpt-4o
      maxTurns: 5
      simulatorSystemPath: simulators/thinker.md

  # ---- On-device-class candidates (U2: R2, R10, R11) --------------------
  # Each candidate is a small instruct model with builds on ALL THREE
  # runtimes the pipeline targets — Ollama / llama.cpp (this harness),
  # WebLLM-prebuilt (Rung 1, browser), and MLX (Rung 2, Apple Silicon) — so
  # the class picked here is runnable on every rung. The availability matrix
  # is in docs/findings/on-device-text-quality.md.
  #
  # The `ollama:` target prefix is deliberately isolated from the pinned
  # `openai:gpt-4o` simulator and the `llm-rubric` judges, so swapping the
  # listener never perturbs the thinker or the scorers. Each candidate runs
  # twice: full-brain (multi-turn.js — the model handles every listener turn)
  # and reduced-role (reduced-role.js — the rules gate answers hierarchy
  # levels 1-2 with a no-model ack, escalating to the model only for
  # substantive turns). Filter to the whole on-device family with
  # `--filter-providers ollama`.
  #
  # The thinker emits clean prose, so these are a CLEAN-TEXT UPPER BOUND
  # relative to live disfluent STT output (the U2->U5 handoff gap).
  #
  # For an OpenAI-compatible local server instead of Ollama (mlx_lm.server,
  # llama-server), keep targetModel on the `openai:` family and point only
  # the listener at the server with `targetConfig` — never a global
  # OPENAI_BASE_URL, which would also hijack the simulator and judges:
  #     targetModel: openai:chat:<served-model-id>
  #     targetConfig: { apiBaseUrl: "http://localhost:8080/v1", apiKey: "local" }

  # Llama-3.2-3B-Instruct
  - id: file://providers/multi-turn.js
    label: ollama-llama3.2-3b-full
    config:
      targetModel: ollama:chat:llama3.2:3b
      simulatorModel: openai:gpt-4o
      maxTurns: 5
      simulatorSystemPath: simulators/thinker.md
  - id: file://providers/reduced-role.js
    label: ollama-llama3.2-3b-reduced
    config:
      targetModel: ollama:chat:llama3.2:3b
      simulatorModel: openai:gpt-4o
      maxTurns: 5
      simulatorSystemPath: simulators/thinker.md

  # Qwen2.5-3B-Instruct
  - id: file://providers/multi-turn.js
    label: ollama-qwen2.5-3b-full
    config:
      targetModel: ollama:chat:qwen2.5:3b
      simulatorModel: openai:gpt-4o
      maxTurns: 5
      simulatorSystemPath: simulators/thinker.md
  - id: file://providers/reduced-role.js
    label: ollama-qwen2.5-3b-reduced
    config:
      targetModel: ollama:chat:qwen2.5:3b
      simulatorModel: openai:gpt-4o
      maxTurns: 5
      simulatorSystemPath: simulators/thinker.md

  # Phi-3.5-mini-instruct (3.8B)
  - id: file://providers/multi-turn.js
    label: ollama-phi3.5-full
    config:
      targetModel: ollama:chat:phi3.5
      simulatorModel: openai:gpt-4o
      maxTurns: 5
      simulatorSystemPath: simulators/thinker.md
  - id: file://providers/reduced-role.js
    label: ollama-phi3.5-reduced
    config:
      targetModel: ollama:chat:phi3.5
      simulatorModel: openai:gpt-4o
      maxTurns: 5
      simulatorSystemPath: simulators/thinker.md

  # Gemma-2-2B-it
  - id: file://providers/multi-turn.js
    label: ollama-gemma2-2b-full
    config:
      targetModel: ollama:chat:gemma2:2b
      simulatorModel: openai:gpt-4o
      maxTurns: 5
      simulatorSystemPath: simulators/thinker.md
  - id: file://providers/reduced-role.js
    label: ollama-gemma2-2b-reduced
    config:
      targetModel: ollama:chat:gemma2:2b
      simulatorModel: openai:gpt-4o
      maxTurns: 5
      simulatorSystemPath: simulators/thinker.md

defaultTest:
  vars:
    claude_system: file://../prompts/claude.md
    chatgpt_system: file://../prompts/chatgpt.md
    gemini_system: file://../prompts/gemini.md
  assert:
    # All four judges run against the full multi-turn transcript
    # returned by providers/multi-turn.js. Variety is meaningful now
    # that each cell produces ~5 listener turns. (.txt rather than
    # .md because promptfoo's llm-rubric loader doesn't accept .md.)
    #
    # restraint scores a TRANSITION — silence while the idea is dictated,
    # then one thread-pull once it lands — so it only means anything if the
    # dictation actually ends. multi-turn.js steers the simulator's last turn
    # into a landing and marks it in the transcript; see the header there.
    #
    # no-summarize is the B3 dealbreaker, and it is a JUDGE rather than a
    # string assertion on purpose: restraint.txt caps the score on a list
    # of banned phrases, and su-lou.11 showed a live on-device run route
    # straight around that list — "it's interesting that you're thinking
    # about the consequences and power of using Voice…" is lexically clean
    # and the identical violation. A phrase list cannot hold B3; only a
    # semantic read of what each turn DOES can.
    - type: llm-rubric
      value: file://judges/probing-depth.txt
    - type: llm-rubric
      value: file://judges/restraint.txt
    - type: llm-rubric
      value: file://judges/no-summarize.txt
    # variety runs behind a JS applicability gate rather than as a bare
    # llm-rubric. The rubric used to carry its own "<=1 questions -> 5" rule,
    # which handed a PERFECT score to zero-question transcripts — the column
    # that measures how the listener's questions differ was flattering a
    # listener that asked none (su-lou.12). asserts/variety.js counts the
    # questions first and returns N/A below two (excluded from the column by
    # .github/scripts/summarize-eval.js), delegating to judges/variety.txt only
    # when there is something to compare. `metric` keeps the column named
    # "variety" regardless of what promptfoo stores in `value` for a file://
    # JS assertion.
    - type: javascript
      value: file://asserts/variety.js
      metric: variety

# Each scenario YAML in scenarios/ is itself a promptfoo test case
# (top-level `description` + `vars` + `metadata`). The glob below loads
# them all, so scenarios/*.yaml is the single source of truth for both
# the starting turn AND the topic / idea_arc that the multi-turn
# simulator consumes.
tests: file://scenarios/*.yaml
