topic: weighing leaving a stable senior engineering role at a midsize company for a riskier early-stage founding-engineer offer
emotional_arc:
  - cautious enthusiasm — naming the appeal of the new role
  - drift into anxiety — money, status, what their partner would say
  - a buried doubt about whether the current role is really as safe as it looks
  - circling back, not landing
starting_turn: "I keep going back and forth on this thing and I don't know if I'm any closer to deciding."
